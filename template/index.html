<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitBuddy | AI Fitness Coach</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="home">

    <!-- NAVBAR -->
    <nav>

        <div class="logo">
            FIT<span>BUDDY</span>
        </div>

        <div class="nav-right">
            <span>AI FITNESS COACH</span>
        </div>

    </nav>


    <!-- MAIN -->
    <main class="hero">

        <!-- LEFT SIDE -->
        <section class="hero-content">

            <p class="green-text">
                ✦ YOUR PERSONAL AI FITNESS COACH
            </p>

            <h1>
                Train smarter.<br>
                <span>Live stronger.</span>
            </h1>

            <p>
                Create a personalized workout and healthy lifestyle
                plan based on your fitness preferences.
            </p>

            <div class="features">
                <span>🤖 AI Powered</span>
                <span>🏋️ Workout Plans</span>
                <span>🥗 Food Guidance</span>
            </div>

        </section>


        <!-- FORM CARD -->
        <section class="glass-card">

            <div class="card-heading">

                <div>
                    <small>LET'S GET STARTED</small>

                    <h2>
                        Create Your Plan
                    </h2>
                </div>

                <div class="round-icon">
                    ✦
                </div>

            </div>


            <form id="fitnessForm">

                <label>Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >


                <label>Age</label>

                <input
                    type="number"
                    id="age"
                    placeholder="Enter your age"
                    required
                >


                <label>Your Goal</label>

                <select id="goal" required>

                    <option value="">
                        Choose your goal
                    </option>

                    <option value="General Fitness">
                        General Fitness
                    </option>

                    <option value="Strength">
                        Strength
                    </option>

                    <option value="Endurance">
                        Endurance
                    </option>

                    <option value="Flexibility">
                        Flexibility
                    </option>

                </select>


                <label>Fitness Level</label>

                <select id="level" required>

                    <option value="">
                        Choose your level
                    </option>

                    <option value="Beginner">
                        Beginner
                    </option>

                    <option value="Intermediate">
                        Intermediate
                    </option>

                    <option value="Advanced">
                        Advanced
                    </option>

                </select>


                <label>Workout Days</label>

                <select id="days" required>

                    <option value="">
                        Days per week
                    </option>

                    <option value="2">
                        2 Days
                    </option>

                    <option value="3">
                        3 Days
                    </option>

                    <option value="4">
                        4 Days
                    </option>

                    <option value="5">
                        5 Days
                    </option>

                </select>


                <button
                    type="submit"
                    class="main-btn"
                >
                    Generate My Plan
                    <b>→</b>
                </button>

            </form>

        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script>

        document
            .getElementById("fitnessForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const user = {

                    name: document
                        .getElementById("name")
                        .value,

                    age: document
                        .getElementById("age")
                        .value,

                    goal: document
                        .getElementById("goal")
                        .value,

                    level: document
                        .getElementById("level")
                        .value,

                    days: document
                        .getElementById("days")
                        .value

                };


                localStorage.setItem(
                    "fitbuddyUser",
                    JSON.stringify(user)
                );


                window.location.href = "Workout.html";

            });

    </script>

</body>

</html>
